syntax = "proto3";

package kora.common.v1;

option go_package = "github.com/kora-finance/kora/gen/go/common;commonv1";

message HealthRequest {}

message HealthResponse {
  string service = 1;
  string status = 2;
  string version = 3;
}

service HealthService {
  rpc Check(HealthRequest) returns (HealthResponse);
}


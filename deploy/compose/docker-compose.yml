services:
  postgres:
    image: postgres:16-alpine
    container_name: kora-postgres
    environment:
      POSTGRES_USER: kora
      POSTGRES_PASSWORD: kora
      POSTGRES_DB: kora
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kora -d kora"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: kora-timescale
    environment:
      POSTGRES_USER: kora
      POSTGRES_PASSWORD: kora
      POSTGRES_DB: kora_timeseries
    ports:
      - "5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kora-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: kora-minio
    environment:
      MINIO_ROOT_USER: kora
      MINIO_ROOT_PASSWORD: kora-password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data

  document-ai:
    build:
      context: ../..
      dockerfile: deploy/containers/document-ai.Dockerfile
    container_name: kora-document-ai
    environment:
      KORA_DOCUMENT_AI_HOST: 0.0.0.0
      KORA_DOCUMENT_AI_PORT: 8088
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent-runtime:
    build:
      context: ../..
      dockerfile: deploy/containers/agent-runtime.Dockerfile
    container_name: kora-agent-runtime
    environment:
      KORA_AGENT_RUNTIME_HOST: 0.0.0.0
      KORA_AGENT_RUNTIME_PORT: 8089
      KORA_AGENT_RUNTIME_TOKEN: ${KORA_AGENT_RUNTIME_TOKEN:-development-only-agent-token}
      DATABASE_URL: postgres://kora:kora@postgres:5432/kora?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  timescale-data:
  redis-data:
  minio-data:
